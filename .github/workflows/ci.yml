name: Automated Data Cleaning & Validation Pipeline CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Integration Tests (pytest)
        run: |
          pytest test_integration.py -v

      - name: Run CLI Pipeline End-to-End
        run: |
          python pipeline.py --input listings.csv.gz --output ci_results/
          test -f ci_results/profiling_report.json
          test -f ci_results/cleaned_data.csv
          test -f ci_results/validation_report.json

      - name: Verify Docker Build (Optional Container Check)
        run: |
          docker build -t data-cleaning-pipeline .
          docker run --rm -v ${{ github.workspace }}/docker_results:/app/results data-cleaning-pipeline --input listings.csv.gz --output results/
          test -f docker_results/profiling_report.json
          test -f docker_results/cleaned_data.csv
          test -f docker_results/validation_report.json
